<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erasmus Mundus Programmes</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="assets/erasmus-data.js"></script>
<script src="assets/sheet-api.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4f8dff;
    --accent2: #7c5cfc;
    --green: #2ecc8a;
    --amber: #f5a623;
    --red: #ff5f5f;
    --violet: #7c5cfc;
    --text: #e8eaf0;
    --muted: #7a819a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { padding: 3.5rem 3rem 2.5rem; border-bottom: 1px solid var(--border); }
  .header-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .18em; color: var(--accent); text-transform: uppercase; margin-bottom: .6rem; }
  .header-label a { color: var(--accent); text-decoration: none; }
  h1 { font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .header-sub { font-size: .88rem; color: var(--muted); margin-top: .7rem; max-width: 560px; line-height: 1.6; }

  main { padding: 2.5rem 3rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.4rem 1.5rem; text-decoration: none; color: var(--text); display: block; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s, border-color .2s; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,.5); border-color: #353c55; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity .25s; }
  .card:hover::before { opacity: 1; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; margin-bottom: .9rem; }
  .sch-name { font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; }
  .sch-tier { font-size: .74rem; color: var(--muted); margin-top: .3rem; }
  .sch-country { font-size: .78rem; color: var(--muted); margin-top: .35rem; display: flex; align-items: center; gap: .35rem; }

  .fund-tag { font-family: 'Space Mono', monospace; font-size: .56rem; letter-spacing: .05em; text-transform: uppercase; padding: .28rem .6rem; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .fund-full    { background: rgba(46,204,138,.15); color: var(--green); }
  .fund-partial { background: rgba(245,166,35,.15); color: var(--amber); }

  .card-about { font-size: .78rem; color: var(--muted); line-height: 1.55; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem .8rem; margin-bottom: 1rem; }
  .meta-label { font-size: .6rem; font-family: 'Space Mono', monospace; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; margin-bottom: .2rem; }
  .meta-value { font-size: .84rem; font-weight: 500; color: var(--text); }

  .doc-progress { font-size: .68rem; font-family: 'Space Mono', monospace; color: var(--muted); margin-bottom: .9rem; }
  .doc-progress.done { color: var(--green); }
  .doc-progress-track { height: 4px; background: var(--surface2); border-radius: 3px; margin-top: .3rem; overflow: hidden; }
  .doc-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .doc-progress.done .doc-progress-fill { background: var(--green); }

  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding-top: .95rem; border-top: 1px solid var(--border); }
  .status-badge { font-family: 'Space Mono', monospace; font-size: .58rem; letter-spacing: .05em; text-transform: uppercase; padding: .28rem .65rem; border-radius: 20px; white-space: nowrap; display: inline-flex; align-items: center; gap: .35rem; }
  .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-researching { background: rgba(79,141,255,.15); color: var(--accent); }
  .st-applied     { background: rgba(245,166,35,.15); color: var(--amber); }
  .st-accepted    { background: rgba(46,204,138,.15); color: var(--green); }
  .st-rejected    { background: rgba(255,95,95,.15); color: var(--red); }
  .card-arrow { color: var(--muted); font-size: .9rem; }

  footer { border-top: 1px solid var(--border); padding: 1.4rem 3rem; font-size: .73rem; color: var(--muted); }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <p class="header-label"><a href="scholarship.html">← Scholarships</a> · Erasmus Mundus · Masters</p>
  <h1>Erasmus <span>Mundus</span></h1>
  <p class="header-sub">7 shortlisted joint-Masters programmes. Click any card for the full profile, eligibility, official links and document checklist.</p>
</header>

<main>
  <div class="cards" id="cards"></div>
</main>

<footer>
  <span>Always verify deadlines on each programme's official website before applying.</span>
</footer>

<script>
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  const fundLabel = { full: 'Fully Funded', partial: 'Partial' };
  const statusLabel = { researching: 'Researching', applied: 'Applied', accepted: 'Accepted', rejected: 'Rejected' };

  function cardHTML(p) {
    const pr = docsProgress(p);
    const status = p._status || 'researching';
    return '<a class="card" href="erasmus/program.html?id=' + p.id + '" data-id="' + p.id + '">' +
      '<div class="card-top"><div>' +
        '<div class="sch-name">' + esc(p.shortName) + '</div>' +
        '<div class="sch-tier">' + esc(p.priorityTier) + '</div>' +
        '<div class="sch-country">' + p.flag + ' ' + esc(p.country) + ' · ' + esc(p.duration) + '</div>' +
      '</div><span class="fund-tag fund-' + p.funding + '">' + fundLabel[p.funding] + '</span></div>' +
      (p.about ? '<div class="card-about">' + esc(p.about) + '</div>' : '') +
      '<div class="meta-grid">' +
        '<div><div class="meta-label">Track</div><div class="meta-value">' + esc(p.trackForMe) + '</div></div>' +
        '<div><div class="meta-label">Coordinator</div><div class="meta-value">' + esc(p.coordinator.split(' (')[0]) + '</div></div>' +
      '</div>' +
      '<div class="doc-progress' + (pr.done === pr.total ? ' done' : '') + '">📋 Documents ' + pr.done + '/' + pr.total +
        '<div class="doc-progress-track"><div class="doc-progress-fill" style="width:' + Math.round(pr.done / pr.total * 100) + '%"></div></div></div>' +
      '<div class="card-foot">' +
        '<span class="status-badge st-' + status + '" data-status-pill="' + p.id + '">' + statusLabel[status] + '</span>' +
        '<span class="card-arrow">Details ↗</span>' +
      '</div>' +
    '</a>';
  }

  function render() {
    document.getElementById('cards').innerHTML = ERASMUS_PROGRAMS.map(cardHTML).join('');
  }
  render();

  // Non-blocking: patch status pills once the Sheet responds, so the page
  // never waits on the network to show content.
  (async function refreshStatuses() {
    if (!(window.SHEET && SHEET.configured())) return;
    try {
      const rows = await SHEET.get('Untitled');
      const byId = {};
      rows.forEach(r => { byId[r.id] = r.status; });
      ERASMUS_PROGRAMS.forEach(p => {
        const st = (byId[p.sheetId] || '').toLowerCase();
        if (!st) return;
        p._status = st;
        const el = document.querySelector('[data-status-pill="' + p.id + '"]');
        if (el) { el.className = 'status-badge st-' + st; el.textContent = statusLabel[st] || st; }
      });
    } catch (e) { /* silent — static content already shown */ }
  })();
</script>
</body>
</html>
