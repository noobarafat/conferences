<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scholarships</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="assets/erasmus-data.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4f8dff;
    --accent2: #7c5cfc;
    --green: #2ecc8a;
    --amber: #f5a623;
    --text: #e8eaf0;
    --muted: #7a819a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { padding: 3.5rem 3rem 2.5rem; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  header::before { content: ''; position: absolute; top: -80px; left: -80px; width: 420px; height: 420px; background: radial-gradient(circle, rgba(79,141,255,0.07) 0%, transparent 70%); pointer-events: none; }
  .header-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .18em; color: var(--accent); text-transform: uppercase; margin-bottom: .6rem; }
  .header-label a { color: var(--accent); text-decoration: none; }
  h1 { font-size: clamp(1.8rem,4vw,2.8rem); font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .header-sub { font-size: .88rem; color: var(--muted); margin-top: .7rem; max-width: 480px; line-height: 1.6; }

  main { padding: 2.5rem 3rem; }
  .section-label { font-family: 'Space Mono', monospace; font-size: .67rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.1rem; display: flex; align-items: center; gap: .6rem; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }

  .cat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.8rem; text-decoration: none; color: var(--text); display: block; position: relative; overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s; }
  .cat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity .25s; }
  .cat-card:hover { transform: translateY(-4px); border-color: #353c55; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .cat-card:hover::before { opacity: 1; }
  .cat-icon { font-size: 2.2rem; margin-bottom: 1rem; }
  .cat-title { font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; }
  .cat-sub { font-size: .84rem; color: var(--muted); margin-top: .4rem; line-height: 1.5; }
  .cat-stats { display: flex; gap: 1.4rem; margin-top: 1.3rem; padding-top: 1.1rem; border-top: 1px solid var(--border); }
  .cat-stat b { display: block; font-family: 'Space Mono', monospace; font-size: 1.1rem; color: var(--accent); }
  .cat-stat span { font-size: .66rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .cat-arrow { position: absolute; top: 1.6rem; right: 1.6rem; color: var(--muted); font-size: 1.1rem; transition: transform .2s, color .2s; }
  .cat-card:hover .cat-arrow { transform: translate(3px,-3px); color: var(--accent); }

  footer { border-top: 1px solid var(--border); padding: 1.4rem 3rem; font-size: .73rem; color: var(--muted); }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <p class="header-label"><a href="conferences.html">← Education Dashboard</a> · Funding · Masters</p>
    <h1>Scholarship <span>Categories</span></h1>
    <p class="header-sub">Fully funded Masters scholarship tracks I'm applying to. Pick a category to see programmes and their full details.</p>
  </div>
</header>

<main>
  <p class="section-label">Categories</p>
  <div class="cat-grid" id="cat-grid"></div>
</main>

<footer>
  <span>Always verify deadlines on each programme's official website before applying.</span>
</footer>

<script>
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function render() {
    const total = ERASMUS_PROGRAMS.length;
    const full = ERASMUS_PROGRAMS.filter(p => p.funding === 'full').length;
    let docsTotal = 0, docsDone = 0;
    ERASMUS_PROGRAMS.forEach(p => { const pr = docsProgress(p); docsTotal += pr.total; docsDone += pr.done; });

    document.getElementById('cat-grid').innerHTML =
      '<a class="cat-card" href="erasmus.html">' +
        '<span class="cat-arrow">↗</span>' +
        '<div class="cat-icon">🎓</div>' +
        '<div class="cat-title">Erasmus Mundus</div>' +
        '<div class="cat-sub">' + total + ' shortlisted joint-Masters programmes across Europe — full profile, eligibility and application documents for each.</div>' +
        '<div class="cat-stats">' +
          '<div class="cat-stat"><b>' + total + '</b><span>Programmes</span></div>' +
          '<div class="cat-stat"><b>' + full + '</b><span>Fully funded</span></div>' +
          '<div class="cat-stat"><b>' + docsDone + '/' + docsTotal + '</b><span>Docs ready</span></div>' +
        '</div>' +
      '</a>';
  }
  render();
</script>
</body>
</html>
