<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erasmus Mundus Programme</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="../assets/erasmus-data.js"></script>
<script src="../assets/sheet-api.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4f8dff;
    --accent2: #7c5cfc;
    --green: #2ecc8a;
    --amber: #f5a623;
    --red: #ff5f5f;
    --text: #e8eaf0;
    --muted: #7a819a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { padding: 3rem 3rem 2rem; border-bottom: 1px solid var(--border); }
  .header-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .18em; color: var(--accent); text-transform: uppercase; margin-bottom: .8rem; }
  .header-label a { color: var(--accent); text-decoration: none; }
  .title-row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  h1 { font-size: clamp(1.6rem,3.6vw,2.4rem); font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
  .sub-line { font-size: .9rem; color: var(--muted); margin-top: .5rem; }
  .tier-pill { font-family: 'Space Mono', monospace; font-size: .68rem; letter-spacing: .05em; padding: .4rem .85rem; border-radius: 20px; background: var(--surface2); color: var(--accent2); white-space: nowrap; }

  main { padding: 2.2rem 3rem 3rem; max-width: 900px; }
  .badges { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.6rem; }
  .fund-tag { font-family: 'Space Mono', monospace; font-size: .62rem; letter-spacing: .05em; text-transform: uppercase; padding: .32rem .75rem; border-radius: 20px; }
  .fund-full    { background: rgba(46,204,138,.15); color: var(--green); }
  .fund-partial { background: rgba(245,166,35,.15); color: var(--amber); }

  select#status-select { font-family: 'Space Mono', monospace; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; padding: .4rem .7rem; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; }

  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 1rem 1.4rem; margin-bottom: 1.8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.3rem 1.5rem; }
  .d-label { font-size: .62rem; font-family: 'Space Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: .3rem; }
  .d-value { font-size: .92rem; font-weight: 500; line-height: 1.4; }

  .section { margin-bottom: 1.8rem; }
  .section h3 { font-family: 'Space Mono', monospace; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: .7rem; }
  .section p { font-size: .92rem; line-height: 1.65; color: var(--text); }
  .about-section { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 1.1rem 1.3rem; }
  .about-section h3 { margin-bottom: .5rem; }
  .section ul { list-style: none; }
  .section li { font-size: .88rem; line-height: 1.55; color: var(--text); padding: .35rem 0 .35rem 1.3rem; position: relative; }
  .section li::before { content: '▸'; position: absolute; left: 0; color: var(--accent2); }

  .links-row { display: flex; gap: .6rem; flex-wrap: wrap; }
  .link-btn { display: inline-flex; align-items: center; gap: .45rem; font-family: 'Space Mono', monospace; font-size: .74rem; padding: .6rem 1.1rem; border-radius: 9px; background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; transition: all .2s; }
  .link-btn:hover { border-color: var(--accent); color: var(--accent); }
  .link-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .link-btn.primary:hover { background: transparent; color: var(--accent); }

  .doc-progress-line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .doc-progress-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; margin: 0 1rem; overflow: hidden; }
  .doc-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
  .doc-progress-line.done .doc-progress-fill { background: var(--green); }
  .doc-count { font-family: 'Space Mono', monospace; font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .doc-checklist { display: flex; flex-direction: column; gap: .1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: .6rem; }
  .doc-check-item { display: flex; align-items: flex-start; gap: .6rem; padding: .55rem .6rem; border-radius: 8px; cursor: pointer; font-size: .85rem; line-height: 1.45; color: var(--text); transition: background .15s; }
  .doc-check-item:hover { background: var(--surface2); }
  .doc-check-item input[type=checkbox] { margin-top: .2rem; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .doc-check-item.checked span { color: var(--muted); text-decoration: line-through; }

  .not-found { padding: 4rem 1rem; text-align: center; color: var(--muted); }

  footer { border-top: 1px solid var(--border); padding: 1.4rem 3rem; font-size: .73rem; color: var(--muted); }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
  }
</style>
</head>
<body>

<header id="header"></header>
<main id="main"></main>
<footer><span>Always verify every detail on the official website before applying.</span></footer>

<script>
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  const fundLabel = { full: 'Fully Funded', partial: 'Partial' };
  const statusLabel = { researching: 'Researching', applied: 'Applied', accepted: 'Accepted', rejected: 'Rejected' };
  const linkLabel = { official: 'Official website', apply: 'Apply', requirements: 'Admission requirements', faq: 'FAQ', computingStream: 'Computing stream', admission: 'Admission' };

  const params = new URLSearchParams(location.search);
  const p = programById(params.get('id'));

  if (!p) {
    document.getElementById('header').innerHTML = '<p class="header-label"><a href="../erasmus.html">← Erasmus Mundus</a></p><h1>Programme not found</h1>';
    document.getElementById('main').innerHTML = '<div class="not-found">No programme matches "' + esc(params.get('id') || '') + '". <a href="../erasmus.html" style="color:var(--accent)">Back to Erasmus Mundus</a></div>';
  } else {
    document.title = p.shortName + ' · Erasmus Mundus';
    let currentStatus = 'researching';

    document.getElementById('header').innerHTML =
      '<p class="header-label"><a href="../erasmus.html">← Erasmus Mundus</a> · ' + p.flag + ' ' + esc(p.country) + '</p>' +
      '<div class="title-row"><div>' +
        '<h1>' + esc(p.shortName) + '</h1>' +
        '<div class="sub-line">' + esc(p.name) + '</div>' +
      '</div><span class="tier-pill">Priority ' + esc(p.priorityTier) + '</span></div>';

    function renderDocs() {
      const pr = docsProgress(p);
      const pct = Math.round(pr.done / pr.total * 100);
      return '<div class="section"><h3>Documents Checklist</h3>' +
        '<div class="doc-progress-line' + (pr.done === pr.total ? ' done' : '') + '">' +
          '<span class="doc-count">' + pr.done + ' / ' + pr.total + '</span>' +
          '<div class="doc-progress-track"><div class="doc-progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<div class="doc-checklist">' + p.documents.map((d, idx) =>
          '<label class="doc-check-item' + (pr.checks[idx] ? ' checked' : '') + '">' +
            '<input type="checkbox" ' + (pr.checks[idx] ? 'checked' : '') + ' data-doc-idx="' + idx + '">' +
            '<span>' + esc(d) + '</span>' +
          '</label>'
        ).join('') + '</div></div>';
    }

    function linksHTML() {
      const entries = Object.keys(p.links);
      return '<div class="section"><h3>Official Links</h3><div class="links-row">' +
        entries.map((k, i) => '<a class="link-btn' + (i === 0 ? ' primary' : '') + '" href="' + esc(p.links[k]) + '" target="_blank" rel="noopener">' + (linkLabel[k] || k) + ' ↗</a>').join('') +
        '</div></div>';
    }

    function render() {
      document.getElementById('main').innerHTML =
        '<div class="badges">' +
          '<span class="fund-tag fund-' + p.funding + '">' + fundLabel[p.funding] + '</span>' +
          '<select id="status-select"></select>' +
        '</div>' +
        (p.about ? '<div class="section about-section"><h3>About This Programme</h3><p>' + esc(p.about) + '</p></div>' : '') +
        '<div class="detail-grid">' +
          '<div><div class="d-label">Coordinator</div><div class="d-value">' + esc(p.coordinator) + '</div></div>' +
          '<div><div class="d-label">Duration</div><div class="d-value">' + esc(p.duration) + '</div></div>' +
          '<div><div class="d-label">Track for me</div><div class="d-value">' + esc(p.trackForMe) + '</div></div>' +
          '<div><div class="d-label">Funding</div><div class="d-value">' + esc(p.amount) + '</div></div>' +
        '</div>' +
        '<div class="section"><h3>Universities</h3><ul>' + p.universities.map(u => '<li>' + esc(u) + '</li>').join('') + '</ul></div>' +
        '<div class="section"><h3>Deadline</h3><p>' + esc(p.deadlineNote) + '</p></div>' +
        '<div class="section"><h3>Eligibility</h3><ul>' + p.eligibility.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></div>' +
        '<div class="section"><h3>Motivation</h3><p>' + esc(p.motivation.type) + ' — ' + esc(p.motivation.spec) + '</p></div>' +
        '<div class="section"><h3>Recommendation Letters</h3><p>' + (p.recommendationLetters.count ? p.recommendationLetters.count + ' — ' : '') + esc(p.recommendationLetters.type) + '</p></div>' +
        (p.video.required ? '<div class="section"><h3>Video</h3><p>' + esc(p.video.spec) + '</p></div>' : '') +
        (p.selection ? '<div class="section"><h3>Selection Process</h3><p>' + esc(p.selection) + '</p></div>' : '') +
        '<div class="section"><h3>Fit Note</h3><p>' + esc(p.fitNote) + '</p></div>' +
        linksHTML() +
        renderDocs();

      const sel = document.getElementById('status-select');
      sel.innerHTML = Object.keys(statusLabel).map(k => '<option value="' + k + '"' + (k === currentStatus ? ' selected' : '') + '>' + statusLabel[k] + '</option>').join('');
      sel.addEventListener('change', onStatusChange);

      document.querySelectorAll('[data-doc-idx]').forEach(cb => {
        cb.addEventListener('change', () => {
          toggleDocCheck(p.id, parseInt(cb.dataset.docIdx, 10));
          render();
        });
      });
    }

    async function onStatusChange(ev) {
      const newStatus = ev.target.value;
      currentStatus = newStatus;
      if (!(window.SHEET && SHEET.configured())) return;
      try {
        await SHEET.update('Untitled', {
          id: p.sheetId, name: p.label, country: p.country, flag: p.flag, degree: p.degree,
          deadline: '', funding: p.funding, status: newStatus, amount: p.amount, duration: p.duration,
          link: p.links.official, summary: p.fitNote, benefits: p.documents.join(' | '),
          eligibility: p.eligibility.join(' | ')
        });
      } catch (e) { /* status still reflected locally even if the write fails */ }
    }

    render();

    (async function loadStatus() {
      if (!(window.SHEET && SHEET.configured())) return;
      try {
        const rows = await SHEET.get('Untitled');
        const row = rows.find(r => r.id === p.sheetId);
        if (row && row.status) { currentStatus = row.status.toLowerCase(); render(); }
      } catch (e) { /* keep default */ }
    })();
  }
</script>
</body>
</html>
