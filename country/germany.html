<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Germany · Country</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="../assets/country-data.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4f8dff;
    --accent2: #7c5cfc;
    --green: #2ecc8a;
    --amber: #f5a623;
    --red: #ff5f5f;
    --text: #e8eaf0;
    --muted: #7a819a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { padding: 3rem 3rem 2rem; border-bottom: 1px solid var(--border); }
  .header-label { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .18em; color: var(--accent); text-transform: uppercase; margin-bottom: .8rem; }
  .header-label a { color: var(--accent); text-decoration: none; }
  h1 { font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 600; line-height: 1.1; letter-spacing: -.02em; }
  .header-sub { font-size: .88rem; color: var(--muted); margin-top: .6rem; }

  main { padding: 2.2rem 3rem 3rem; max-width: 900px; }
  .section { margin-bottom: 2.2rem; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
  .section-head h2 { font-size: 1.2rem; font-weight: 600; }
  .btn { font-family: 'Space Mono', monospace; font-size: .72rem; letter-spacing: .04em; padding: .55rem 1.1rem; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; text-transform: uppercase; transition: background .2s; }
  .btn:hover { background: var(--accent2); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  .doc-progress-line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .doc-progress-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; margin: 0 1rem; overflow: hidden; }
  .doc-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
  .doc-progress-line.done .doc-progress-fill { background: var(--green); }
  .doc-count { font-family: 'Space Mono', monospace; font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .doc-checklist { display: flex; flex-direction: column; gap: .1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: .6rem; }
  .doc-check-item { display: flex; align-items: flex-start; gap: .6rem; padding: .55rem .6rem; border-radius: 8px; cursor: pointer; font-size: .85rem; line-height: 1.45; color: var(--text); transition: background .15s; }
  .doc-check-item:hover { background: var(--surface2); }
  .doc-check-item input[type=checkbox] { margin-top: .2rem; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .doc-check-item.checked span { color: var(--muted); text-decoration: line-through; }

  .uni-list { display: flex; flex-direction: column; gap: .8rem; }
  .uni-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.2rem 1.4rem; }
  .uni-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .uni-name { font-size: 1rem; font-weight: 600; }
  .uni-details { font-size: .86rem; color: var(--text); margin-top: .5rem; line-height: 1.55; white-space: pre-wrap; }
  .uni-link { font-size: .78rem; color: var(--accent); text-decoration: none; margin-top: .5rem; display: inline-block; }
  .uni-actions { display: flex; gap: .4rem; }
  .icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: .85rem; transition: all .2s; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.del:hover { border-color: var(--red); color: var(--red); }
  .status-badge { font-family: 'Space Mono', monospace; font-size: .58rem; letter-spacing: .05em; text-transform: uppercase; padding: .28rem .65rem; border-radius: 20px; white-space: nowrap; display: inline-flex; align-items: center; gap: .35rem; margin-top: .6rem; }
  .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-researching { background: rgba(79,141,255,.15); color: var(--accent); }
  .st-applied     { background: rgba(245,166,35,.15); color: var(--amber); }
  .st-accepted    { background: rgba(46,204,138,.15); color: var(--green); }
  .st-rejected    { background: rgba(255,95,95,.15); color: var(--red); }
  .empty-state { padding: 2.5rem 1rem; text-align: center; color: var(--muted); font-size: .86rem; background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(6,8,12,.78); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 5vh 1.25rem; z-index: 50; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; }
  .modal-header { padding: 1.5rem 1.6rem 1.1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 1.15rem; font-weight: 600; }
  .modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
  .modal-body { padding: 1.4rem 1.6rem 1.6rem; }
  .field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; }
  .field label { font-size: .62rem; font-family: 'Space Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .6rem .75rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: .85rem; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 80px; }
  .form-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: .5rem; }

  footer { border-top: 1px solid var(--border); padding: 1.4rem 3rem; font-size: .73rem; color: var(--muted); }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 1.25rem; padding-right: 1.25rem; }
  }
</style>
</head>
<body>

<header>
  <p class="header-label"><a href="../country.html">← Countries</a></p>
  <h1>🇩🇪 Germany</h1>
  <p class="header-sub">Document checklist and target universities for Germany applications.</p>
</header>

<main>
  <div class="section">
    <div class="section-head"><h2>Documents</h2></div>
    <div id="docs-box"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2>University</h2>
      <button class="btn" onclick="openUniForm()">+ Add University</button>
    </div>
    <div class="uni-list" id="uni-list"></div>
  </div>
</main>

<footer><span>Always verify requirements on each university's official website.</span></footer>

<div class="modal-overlay" id="uni-modal" onclick="if(event.target===this)closeUniForm()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="uni-modal-title">Add University</div>
      <button class="modal-close" onclick="closeUniForm()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="uni-form" onsubmit="return saveUni(event)">
        <div class="field"><label>University Name</label><input name="name" required></div>
        <div class="field"><label>Details (programme, deadline, requirements, notes...)</label><textarea name="details"></textarea></div>
        <div class="field"><label>Link (official page)</label><input name="link" placeholder="https://..."></div>
        <div class="field"><label>Status</label>
          <select name="status">
            <option value="researching">Researching</option>
            <option value="applied">Applied</option>
            <option value="accepted">Accepted</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" onclick="closeUniForm()">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
  function uid() { return 'u' + Math.random().toString(36).slice(2, 10); }
  const statusLabel = { researching: 'Researching', applied: 'Applied', accepted: 'Accepted', rejected: 'Rejected' };

  const country = countryById('germany');

  function renderDocs() {
    const pr = countryDocsProgress(country);
    const pct = Math.round(pr.done / pr.total * 100);
    document.getElementById('docs-box').innerHTML =
      '<div class="doc-progress-line' + (pr.done === pr.total ? ' done' : '') + '">' +
        '<span class="doc-count">' + pr.done + ' / ' + pr.total + ' (' + pct + '%)</span>' +
        '<div class="doc-progress-track"><div class="doc-progress-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
      '<div class="doc-checklist">' + country.documents.map((d, idx) =>
        '<label class="doc-check-item' + (pr.checks[idx] ? ' checked' : '') + '">' +
          '<input type="checkbox" ' + (pr.checks[idx] ? 'checked' : '') + ' data-idx="' + idx + '">' +
          '<span>' + esc(d) + '</span>' +
        '</label>'
      ).join('') + '</div>';
    document.querySelectorAll('[data-idx]').forEach(cb => {
      cb.addEventListener('change', () => { toggleCountryDocCheck('germany', parseInt(cb.dataset.idx, 10)); renderDocs(); });
    });
  }

  let editingId = null;
  function renderUnis() {
    const list = getCountryUnis('germany');
    const box = document.getElementById('uni-list');
    if (!list.length) { box.innerHTML = '<div class="empty-state">No universities added yet. Click "+ Add University" to start.</div>'; return; }
    box.innerHTML = list.map(u =>
      '<div class="uni-card"><div class="uni-top"><div>' +
        '<div class="uni-name">' + esc(u.name) + '</div>' +
        (u.details ? '<div class="uni-details">' + esc(u.details) + '</div>' : '') +
        (u.link ? '<a class="uni-link" href="' + esc(u.link) + '" target="_blank" rel="noopener">Official page ↗</a>' : '') +
        '<div><span class="status-badge st-' + (u.status || 'researching') + '">' + (statusLabel[u.status] || 'Researching') + '</span></div>' +
      '</div><div class="uni-actions">' +
        '<button class="icon-btn" onclick="openUniForm(\'' + u.id + '\')" title="Edit">✎</button>' +
        '<button class="icon-btn del" onclick="deleteUni(\'' + u.id + '\')" title="Delete">🗑</button>' +
      '</div></div></div>'
    ).join('');
  }

  function openUniForm(id) {
    editingId = id || null;
    const f = document.getElementById('uni-form');
    f.reset();
    document.getElementById('uni-modal-title').textContent = id ? 'Edit University' : 'Add University';
    if (id) {
      const u = getCountryUnis('germany').find(x => x.id === id);
      if (u) {
        f.elements.name.value = u.name || '';
        f.elements.details.value = u.details || '';
        f.elements.link.value = u.link || '';
        f.elements.status.value = u.status || 'researching';
      }
    }
    document.getElementById('uni-modal').classList.add('open');
  }
  function closeUniForm() { document.getElementById('uni-modal').classList.remove('open'); editingId = null; }
  function saveUni(ev) {
    ev.preventDefault();
    const f = ev.target;
    const rec = { name: f.elements.name.value.trim(), details: f.elements.details.value.trim(), link: f.elements.link.value.trim(), status: f.elements.status.value };
    const list = getCountryUnis('germany');
    if (editingId) {
      const u = list.find(x => x.id === editingId);
      if (u) Object.assign(u, rec);
    } else {
      list.push(Object.assign({ id: uid() }, rec));
    }
    saveCountryUnis('germany', list);
    closeUniForm();
    renderUnis();
    return false;
  }
  function deleteUni(id) {
    if (!confirm('Delete this university?')) return;
    saveCountryUnis('germany', getCountryUnis('germany').filter(x => x.id !== id));
    renderUnis();
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeUniForm(); });

  renderDocs();
  renderUnis();
</script>
</body>
</html>
